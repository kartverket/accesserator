name: Build OPA bundle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: kartverket/github-workflows/.github/workflows/build-and-push-opa-rules.yml@65cef73f7e7ca23a212b55200a3d50ea118075e6
    with:
      artifactName: something-random
      rego-path: .opa
      test-path: .opa
      additional-tags: |
        ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}