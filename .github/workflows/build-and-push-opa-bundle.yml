name: Build OPA bundle

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.compute.outputs.branch }}
    steps:
      - id: compute
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # `head_ref` is set on pull_request events; on push it's empty.
          if [[ -n "$HEAD_REF" ]]; then
            tag="$HEAD_REF"
          else
            tag="$REF_NAME"
          fi
          # OCI tags can't contain `/`, so replace with `-`.
          echo "branch=${tag//\//-}" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    uses: kartverket/github-workflows/.github/workflows/build-and-push-opa-rules.yml@2a48ed92e60552c1240b6969002e8b8ec0ab91f5
    with:
      artifactName: ${{ github.repository }}/opa-bundle
      rego-path: .opa
      test-path: .opa
      lint: true
      additional-tags: ${{ needs.tags.outputs.branch }}