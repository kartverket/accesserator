name: Build OPA bundle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: read
  security-events: write

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.compute.outputs.branch }}
    steps:
      - id: compute
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # `head_ref` is set on pull_request events; on push it's empty.
          if [[ -n "$HEAD_REF" ]]; then
            tag="$HEAD_REF"
          else
            tag="$REF_NAME"
          fi
          # OCI tags can't contain `/`, so replace with `-`.
          echo "branch=${tag//\//-}" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    uses: kartverket/github-workflows/.github/workflows/build-and-push-opa-bundle.yml@v4.13.2
    with:
      artifact-name: ghcr.io/${{ github.repository }}/opa-bundle
      path: .opa
      test: true
      lint: true
      additional-tags: ${{ needs.tags.outputs.branch }}
