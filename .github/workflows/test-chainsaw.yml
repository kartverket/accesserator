name: Run Chainsaw Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kubefwd
        shell: bash
        run: |
          curl -L https://github.com/txn2/kubefwd/releases/download/v1.25.12/kubefwd_Linux_x86_64.tar.gz | tar xz
          sudo mv kubefwd /usr/local/bin/

      - name: Setup Kind cluster and deploy accesserator
        run: |
          make local deploy mock-oauth2-ingress

      - name: Run Chainsaw tests
        run: |
          make chainsaw-test-remote
