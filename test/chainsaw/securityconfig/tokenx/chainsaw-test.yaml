apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: token-x
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespaceTemplate:
    metadata:
      name: chainsaw-token-x
      labels:
        skip.kartverket.no/skip-managed: "true"
  steps:
    - try:
        # setup
        - create:
            file: namespaces.yaml
        - create:
            file: skiperator-application.yaml

        # tokenx disabled gives no resources
        - create:
            file: securityconfig-tokenx-disabled.yaml
        - error:
            file: jwker-with-rules.yaml
        - error:
            file: jwker-without-rules.yaml
        - error:
            file: netpol.yaml
        - error:
            file: securityconfig-with-updated-status.yaml

        # tokenx enabled without access policies gives jwker without rules
        - patch:
            resource:
              apiVersion: accesserator.kartverket.no/v1alpha
              kind: SecurityConfig
              metadata:
                name: security-config
              spec:
                tokenx:
                  enabled: true
        - assert:
            file: securityconfig-with-updated-status.yaml
        - assert:
            file: jwker-without-rules.yaml
        - error:
            file: jwker-with-rules.yaml
        - assert:
            file: netpol.yaml

        # tokenx enabled with access policies gives jwker with rules
        - patch:
            resource:
              apiVersion: accesserator.kartverket.no/v1alpha
              kind: SecurityConfig
              metadata:
                name: security-config
              spec:
                tokenx:
                  enabled: true
                  accessPolicy:
                    inheritInboundRules: true
                    clients:
                      - application: clients-list-app-1
                        namespace: clients-list-namespace-1
                      - application: clients-list-app-2
                        namespace: clients-list-namespace-2
        - assert:
            file: securityconfig-with-updated-status.yaml
        - assert:
            file: jwker-with-rules.yaml
        - assert:
            file: netpol.yaml
