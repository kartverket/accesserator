apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: token-x
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespaceTemplate:
    metadata:
      name: chainsaw-token-x
      labels:
        skip.kartverket.no/skip-managed: "true"
  steps:
    - try:
        - create:
            file: skiperator-application.yaml
        - create:
            file: securityconfig-tokenx-disabled.yaml
        - error:
            file: jwker.yaml
        - error:
            file: netpol.yaml
        - error:
            file: securityconfig-with-updated-status.yaml
        - patch:
            resource:
              apiVersion: accesserator.kartverket.no/v1alpha
              kind: SecurityConfig
              metadata:
                name: security-config
              spec:
                tokenx:
                  enabled: true
        - assert:
            file: securityconfig-with-updated-status.yaml
        - assert:
            file: jwker.yaml
        - assert:
            file: netpol.yaml