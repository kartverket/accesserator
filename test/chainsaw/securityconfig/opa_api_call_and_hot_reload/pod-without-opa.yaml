apiVersion: v1
kind: Pod
metadata:
  labels:
    app: app
    app.kubernetes.io/managed-by: skiperator
    app.kubernetes.io/name: app
    application.skiperator.no/app: app
    application.skiperator.no/app-name: app
    skiperator.kartverket.no/controller: application
spec:
  containers:
    - name: app
  initContainers:
    - name: istio-init
    - name: istio-proxy
status:
  containerStatuses:
    - name: app
      ready: true
  initContainerStatuses:
    - name: istio-init
      ready: true
    - name: istio-proxy
      ready: true
  phase: Running
