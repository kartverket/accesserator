apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: texas
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespaceTemplate:
    metadata:
      name: chainsaw-texas
      labels:
        accesserator-webhooks: enabled
  steps:
    - try:
        - create:
            file: skiperator-applications.yaml
        - create:
            file: securityconfigs.yaml
        - script:
            content: |
              until kubectl get deployment app -n chainsaw-texas 2>/dev/null; do sleep 1; done
              kubectl rollout status deployment/app -n chainsaw-texas --timeout=20s
              kubectl wait --for=condition=Ready pod -l app=app -n chainsaw-texas --timeout=20s
        - script:
            content: | 
              # Verify that TEXAS_URL is not set and assert that the number of containers in the app is 2.
              kubectl exec -n chainsaw-texas deploy/app -c app -- printenv TEXAS_URL && exit 1 || exit 0
        - assert:
            file: pod-without-texas.yaml
        - patch:
            resource:
              apiVersion: skiperator.kartverket.no/v1alpha1
              kind: Application
              metadata:
                name: app
              spec:
                podSettings:
                  annotations:
                    accesserator.kartverket.no/services: "texas"
        - script:
            content: |
              kubectl rollout status deployment/app -n chainsaw-texas --timeout=20s
              kubectl wait --for=condition=Ready pod -l app=app -n chainsaw-texas --timeout=20s
        - script:
            content: |
              # Verify TEXAS_URL is set
              TEXAS_URL=$(kubectl exec -n chainsaw-texas deploy/app -c app -- printenv TEXAS_URL)
              if [ -z "$TEXAS_URL" ]; then echo "❌ TEXAS_URL is not set"; exit 1; fi

              # Get a mock token from mock-oauth2
              MOCK_TOKEN=$(make -C ../../../.. mock-token)
              if [ -z "$MOCK_TOKEN" ]; then echo "❌ No access_token found in mock-oauth2 response"; exit 1; fi

              # Call texas token exchange and verify tokenx is disabled
              RESPONSE=$(kubectl exec -n chainsaw-texas deploy/app -c app -- \
                curl -sX POST $TEXAS_URL/api/v1/token/exchange \
                  -H "Content-Type: application/json" \
                  -d "{\"identity_provider\":\"tokenx\",\"target\":\"kind-accesserator:chainsaw-texas:another-app\",\"user_token\":\"$MOCK_TOKEN\"}")
              ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
              if [ "$ERROR" != "invalid_request" ]; then echo "❌ Expected invalid_request error, got: $ERROR"; exit 1; fi
              ERROR_DESC=$(echo "$RESPONSE" | jq -r '.error_description // empty')
              if [ "$ERROR_DESC" != "identity provider 'tokenx' is not enabled" ]; then echo "❌ Unexpected error_description: $ERROR_DESC"; exit 1; fi
        - patch:
            resource:
              apiVersion: accesserator.kartverket.no/v1alpha
              kind: SecurityConfig
              metadata:
                name: security-config-app
              spec:
                tokenx:
                  enabled: true
        - script:
            content: |
              kubectl rollout restart -n chainsaw-texas deployment/app
              kubectl rollout status -n chainsaw-texas deployment/app --timeout=20s
        - script:
            content: |
              # Verify TEXAS_URL is still set
              TEXAS_URL=$(kubectl exec -n chainsaw-texas deploy/app -c app -- printenv TEXAS_URL)
              if [ -z "$TEXAS_URL" ]; then echo "❌ TEXAS_URL is not set after enabling tokenx"; exit 1; fi

              # Get a mock token from mock-oauth2
              MOCK_TOKEN=$(make -C ../../../.. mock-token)
              if [ -z "$MOCK_TOKEN" ]; then echo "❌ No access_token found in mock-oauth2 response"; exit 1; fi

              # Call texas token exchange and verify tokenx is enabled
              RESPONSE=$(kubectl exec -n chainsaw-texas deploy/app -c app -- \
                  curl -sX POST $TEXAS_URL/api/v1/token/exchange \
                  -H "Content-Type: application/json" \
                  -d "{\"identity_provider\":\"tokenx\",\"target\":\"kind-accesserator:chainsaw-texas:another-app\",\"user_token\":\"$MOCK_TOKEN\"}" \
                  -w "\n%{http_code}")
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | awk 'NR>1{print prev} {prev=$0}')
              if [ "$HTTP_CODE" != "200" ]; then echo "❌ Expected HTTP 200, got: $HTTP_CODE. Body: $BODY"; exit 1; fi
              ACCESS_TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')
              if [ -z "$ACCESS_TOKEN" ]; then echo "❌ access_token is empty. Body: $BODY"; exit 1; fi
              if ! echo "$ACCESS_TOKEN" | grep -q "^ey"; then echo "❌ access_token does not start with 'ey': $ACCESS_TOKEN"; exit 1; fi
