apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: "accesserator-system/webhook-cert"
webhooks:
  - name: mpod-v1.kb.io
    clientConfig:
      service:
        name: webhook-service
        namespace: accesserator-system
    namespaceSelector:
      matchExpressions:
        - key: skip.kartverket.no/skip-managed
          operator: In
          values:
            - "true"
    matchConditions:
      - name: has-accesserator-annotation-prefix
        expression: >
          object != null &&
          object.metadata != null &&
          ('annotations' in object.metadata) &&
          object.metadata.annotations.exists(k, k.startsWith("accesserator.kartverket.no/"))
      - name: has-skiperator-app-label
        expression: >
          object != null &&
          object.metadata != null &&
          ('labels' in object.metadata) &&
          ('application.skiperator.no/app-name' in object.metadata.labels)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: "accesserator-system/webhook-cert"
webhooks:
  - name: vpod-v1.kb.io
    clientConfig:
      service:
        name: webhook-service
        namespace: accesserator-system
    namespaceSelector:
      matchExpressions:
        - key: skip.kartverket.no/skip-managed
          operator: In
          values:
            - "true"
    matchConditions:
      - name: has-accesserator-annotation-prefix
        expression: >
          object != null &&
          object.metadata != null &&
          ('annotations' in object.metadata) &&
          object.metadata.annotations.exists(k, k.startsWith("accesserator.kartverket.no/"))
      - name: has-skiperator-app-label
        expression: >
          object != null &&
          object.metadata != null &&
          ('labels' in object.metadata) &&
          ('application.skiperator.no/app-name' in object.metadata.labels)
  - name: vsecurityconfig-v1alpha.kb.io
    clientConfig:
      service:
        name: webhook-service
        namespace: accesserator-system