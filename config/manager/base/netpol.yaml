apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accesserator
  namespace: accesserator-system
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - port: 9443
          protocol: TCP
  podSelector:
    matchLabels:
      app: accesserator
  policyTypes:
    - Ingress