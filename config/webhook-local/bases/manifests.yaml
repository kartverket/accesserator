apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: accesserator-mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: "accesserator-system/webhook-cert"
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      url : https://host.docker.internal:9443/mutate--v1-pod
    failurePolicy: Fail
    name: mpod-v1.kb.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: skip.kartverket.no/skip-managed
          operator: In
          values:
            - "true"
    matchConditions:
      - name: has-accesserator-annotation
        expression: >
          object != null &&
          object.metadata != null &&
          object.metadata.annotations != null &&
          object.metadata.annotations.exists(k, k.startsWith("accesserator.kartverket.no/"))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
