  annotations:
    cert-manager.io/inject-ca-from: "accesserator-system/webhook-cert"
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      url: https://host.docker.internal:9443/validate--v1-pod
    name: vpod-v1.kb.io
    failurePolicy: Fail
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: skip.kartverket.no/skip-managed
          operator: In
          values:
            - "true"
    matchConditions:
      - name: has-accesserator-annotation
        expression: >
          object != null &&
          object.metadata != null &&
          object.metadata.annotations != null &&
          object.metadata.annotations.exists(k, k.startsWith("accesserator.kartverket.no/"))
