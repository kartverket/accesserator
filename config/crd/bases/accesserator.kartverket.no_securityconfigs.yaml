---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: securityconfigs.accesserator.kartverket.no
spec:
  group: accesserator.kartverket.no
  names:
    kind: SecurityConfig
    listKind: SecurityConfigList
    plural: securityconfigs
    singular: securityconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Status
      type: string
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: SecurityConfig is the Schema for the securityconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SecurityConfig
            properties:
              applicationRef:
                description: ApplicationRef is a reference to the name of the SKIP
                  application for which this SecurityConfig applies.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              maskinporten:
                description: |-
                  Maskinporten specifies whether to configure the maskinporten API consumer capability for an application referred to by `applicationRef`.
                  The configuration can either be provided inline via the `client` field,
                  by referencing an existing MaskinportenClient resource via the `clientRef` field,
                  or by sourcing credentials from existing Kubernetes secrets via the `secretRef` field.
                properties:
                  client:
                    description: |-
                      Client defines the Maskinporten client configuration inline.
                      Use this when you want to configure the client directly.
                    properties:
                      clientName:
                        description: |-
                          ClientName is the client name to be registered at DigDir.
                          It is shown during login for user-centric flows, and is otherwise a human-readable way to differentiate between clients at DigDir's self-service portal.
                        maxLength: 100
                        minLength: 1
                        type: string
                      scopes:
                        description: Scopes is an object of consumed scopes.
                        properties:
                          consumes:
                            description: '`consumes` is a list of scopes that your
                              client can request access to.'
                            items:
                              properties:
                                name:
                                  description: |-
                                    The scope consumed by the application to gain access to an external organization API.
                                    Ensure that the NAV organization has been granted access to the scope prior to requesting access.
                                  type: string
                              required:
                              - name
                              type: object
                            maxItems: 100
                            minItems: 1
                            type: array
                        required:
                        - consumes
                        type: object
                    required:
                    - clientName
                    type: object
                  clientRef:
                    description: |-
                      ClientRef references an existing MaskinportenClient by name.
                      Use this when a MaskinportenClient exists, and you want to reference it.
                    properties:
                      name:
                        description: Name of the referenced MaskinportenClient.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    description: Enabled indicates whether Maskinporten should be
                      configured for the application.
                    type: boolean
                  secretRef:
                    description: |-
                      SecretRef sources the Maskinporten client credentials from one or more existing Kubernetes secrets.
                      Use this when you have an existing OAuth client registered outside the SecurityConfig CRD
                      and MaskinportenClient CRD (e.g. manually registered at DigDir).
                    properties:
                      clientID:
                        description: ClientID references the secret key containing
                          the Maskinporten client ID (MASKINPORTEN_CLIENT_ID).
                        properties:
                          key:
                            description: Key is the key within the secret whose value
                              should be used.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-zA-Z0-9]([-._a-zA-Z0-9]*[a-zA-Z0-9])?$
                            type: string
                          name:
                            description: Name is the name of the Kubernetes secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      clientJWK:
                        description: ClientJWK references the secret key containing
                          the Maskinporten client JWK (MASKINPORTEN_CLIENT_JWK).
                        properties:
                          key:
                            description: Key is the key within the secret whose value
                              should be used.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-zA-Z0-9]([-._a-zA-Z0-9]*[a-zA-Z0-9])?$
                            type: string
                          name:
                            description: Name is the name of the Kubernetes secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - clientID
                    - clientJWK
                    type: object
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: At most one of client, clientRef, or secretRef may be specified.
                  rule: '[has(self.client), has(self.clientRef), has(self.secretRef)].filter(x,
                    x).size() <= 1'
              opa:
                description: |-
                  Opa specifies whether to configure the open policy agent capability for an application referred to by `applicationRef`.
                  The configuration includes which bundles compiled from rego policies, and how often OPA should check for updates to these bundles.
                properties:
                  bundleUrls:
                    description: BundleURLs is a list of URLs pointing to OPA bundles
                      containing compiled rego policies.
                    items:
                      description: BundleSource defines a source for an OPA bundle.
                      properties:
                        name:
                          description: |-
                            Name specifies a human-readable name for the OPA bundle.
                            It is used to differentiate between bundles which is used by OPA.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z0-9]([-._a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        url:
                          description: URL is the OCI registry location of the OPA
                            bundle.
                          maxLength: 253
                          type: string
                      required:
                      - name
                      - url
                      type: object
                    maxItems: 20
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: Each bundle name must be unique
                      rule: self.all(x, self.filter(y, y.name == x.name).size() ==
                        1)
                    - message: Each bundle URL must be unique
                      rule: self.all(x, self.filter(y, y.url == x.url).size() == 1)
                  enabled:
                    description: Enabled indicates whether OPA should be configured
                      for the application.
                    type: boolean
                required:
                - bundleUrls
                - enabled
                type: object
              tokenx:
                description: |-
                  Tokenx specifies whether to configure the token exchange capability for an application referred to by `applicationRef`.
                  accessPolicies of the application referred to by applicationRef
                  will be used to restrict which applications can exchange tokens where the specified application is the intended audience.
                properties:
                  accessPolicy:
                    description: |-
                      AccessPolicy specifies configuration of which clients can exchange tokens with the application as target when
                      token exchange is enabled. If not specified, no clients are allowed.
                    properties:
                      clients:
                        description: Clients which may perform token exchange with
                          your application as target.
                        items:
                          description: AccessPolicyClient define client applications
                            which may perform token exchange with your application
                            as target.
                          properties:
                            application:
                              description: Application is the name of the client application
                                that can exchange tokens with the target application.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                            namespace:
                              description: |-
                                Namespace is the namespace which the client application resides. If not specified, the namespace of the
                                SecurityConfig's referenced application will be used.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                          required:
                          - application
                          type: object
                        maxItems: 100
                        minItems: 1
                        type: array
                      inheritInboundRules:
                        description: |-
                          InheritInboundRules specifies whether the inbound access policy rules of the corresponding Skiperator Application
                          should be used as clients for token exchange. Defaults to false. When set to true, the complete list of clients
                          will be the union of the explicitly specified clients in Clients and the clients resolved from inbound rules.
                        type: boolean
                    type: object
                  enabled:
                    description: Enabled indicates whether token exchange should be
                      configured for the application.
                    type: boolean
                required:
                - enabled
                type: object
            required:
            - applicationRef
            type: object
          status:
            description: status defines the observed state of SecurityConfig
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jwkerSecretName:
                type: string
              maskinportenSecretName:
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              opaBundleNames:
                items:
                  type: string
                type: array
              phase:
                type: string
              ready:
                type: boolean
            required:
            - ready
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
